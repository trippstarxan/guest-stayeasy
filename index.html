<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StayEasy guest app starter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{/* StayEasy design system (from Figma) */--primary:#633541;--secondary:#D9C5AC;--ink:#302832;--rose:#C18F91;--slate:#899BA8;--bg:#F8F3EC;--card:#FEFDFB;--line:#E3D6C4;--field:#A1868D;--soft:#F0E8DE;--muted:#59535B;--bad:#B3261E;--ok:#1F7A4D;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;margin:0 0 .5rem;line-height:1.1}h2{font-size:clamp(1.6rem,4vw,2.1rem)}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;background:rgba(248,243,236,.85);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.scrolled{border-color:var(--line);box-shadow:0 8px 24px -18px rgba(48,40,50,.5)}
.bar{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem}
.brand{display:flex;align-items:center;gap:.55rem;font:800 1.2rem Manrope,sans-serif;color:var(--primary);background:none;border:0;cursor:pointer;padding:0}
.logo{width:32px;height:32px;border-radius:10px;background:var(--primary);color:var(--secondary);display:grid;place-items:center;transition:transform .4s var(--ease)}.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}
nav{display:flex;gap:.2rem}
nav button{border:0;background:none;color:var(--ink);padding:.5rem 1rem;border-radius:99px;font:600 .95rem Manrope,sans-serif;cursor:pointer;transition:background .25s,color .25s}
nav button:hover{background:var(--soft)}nav button.on{background:var(--primary);color:#fff}
.wake{background:var(--secondary);padding:.6rem 1rem;text-align:center;font-weight:600}
main{margin:0 auto;padding:1.2rem 1rem 4rem}main.wide{max-width:1040px}main.narrow{max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 1px 0 rgba(48,40,50,.03)}
label{display:block;font-weight:600;margin:.9rem 0 .3rem}
input,select,textarea{width:100%;font:inherit;padding:.75rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,53,65,.12)}
input[type=checkbox],input[type=radio]{width:auto}
button.go{display:block;width:100%;background:var(--primary);color:#fff;border:0;border-radius:14px;padding:.95rem 1.1rem;font:700 1rem Manrope,sans-serif;cursor:pointer;margin-top:1rem;transition:transform .25s var(--ease),box-shadow .25s}
button.go:hover{transform:translateY(-2px);box-shadow:0 14px 26px -14px rgba(99,53,65,.7)}button.go:active{transform:none}
button.go:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
button.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--field)}button.alt:hover{box-shadow:inset 0 0 0 1.5px var(--primary)}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.9rem 1.4rem;border-radius:99px;border:0;font:700 1rem Manrope,sans-serif;cursor:pointer;background:var(--secondary);color:var(--primary);transition:transform .25s var(--ease)}
.btn:hover{transform:translateY(-2px)}.btn .ic{transition:transform .25s}.btn:hover .ic{transform:translateX(4px)}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}.btn.sm{padding:.55rem 1rem;background:var(--primary);color:#fff;font-size:.9rem}
.msg{padding:.75rem .95rem;border-radius:12px;margin-top:.9rem;font-weight:500}
.msg.bad{background:#FBE9E7;color:var(--bad)}.msg.ok{background:#E2F3EA;color:var(--ok)}.msg.info{background:var(--soft)}
.muted{color:var(--muted)}.sm{font-size:.85rem}
.chip{display:inline-block;padding:.12rem .65rem;border-radius:99px;background:var(--soft);font-size:.82rem;font-weight:700}
.big{font-weight:800;font-size:2.6rem;letter-spacing:-.03em}
.link{background:none;border:0;color:var(--primary);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}.back{margin-bottom:.6rem;display:inline-block}
/* hero and home */
.hero{position:relative;overflow:hidden;background:var(--primary);color:#fff;border-radius:28px;padding:clamp(2rem,6vw,4.5rem) clamp(1.3rem,5vw,3.5rem);min-height:min(72vh,540px);display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:1.2rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--secondary);position:relative;z-index:1}
.hero h1{font-size:clamp(3.8rem,16vw,9.5rem);line-height:.88;letter-spacing:-.045em;margin:.7rem 0 1.1rem;position:relative;z-index:1}
.ln{display:block;overflow:hidden;padding-bottom:.08em}.ln i{display:block;font-style:normal;transform:translateY(110%);animation:up .95s var(--ease) forwards}.ln:nth-child(2) i{animation-delay:.14s;color:var(--secondary)}
.hero p{max-width:32rem;color:var(--soft);font-size:1.1rem;margin:0 0 1.5rem;position:relative;z-index:1;animation:rise .8s .4s var(--ease) both}
.cta{display:flex;gap:.7rem;flex-wrap:wrap;position:relative;z-index:1;animation:rise .8s .55s var(--ease) both}
.orb{position:absolute;border-radius:50%;animation:float 9s ease-in-out infinite}.o1{width:360px;height:360px;right:-90px;top:-100px;background:var(--rose);opacity:.35}.o2{width:210px;height:210px;right:14%;bottom:-80px;background:var(--secondary);opacity:.22;animation-delay:-4s}
.marquee{overflow:hidden;background:var(--secondary);border-radius:18px;padding:.9rem 0;margin-bottom:2rem}
.track{display:flex;gap:2.5rem;width:max-content;animation:mq 30s linear infinite}.marquee:hover .track{animation-play-state:paused}
.track span{font-weight:800;font-size:clamp(1.4rem,4vw,2.3rem);letter-spacing:-.02em;color:var(--primary);white-space:nowrap}.track span::after{content:"✦";margin-left:2.5rem;color:var(--rose)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin:1rem 0 2rem}
.how .card{margin:0;transition:transform .35s var(--ease),box-shadow .35s}.how .card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -26px rgba(99,53,65,.6)}
.num{font-size:3.2rem;font-weight:800;letter-spacing:-.04em;color:var(--rose);line-height:1}
/* rooms */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.1rem;margin-top:1rem}
.rc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s}
.rc:hover{transform:translateY(-6px);box-shadow:0 26px 44px -28px rgba(99,53,65,.65)}
.ph{height:190px;background:var(--secondary) center/cover;color:var(--primary);display:grid;place-items:center;overflow:hidden;transition:transform .6s var(--ease)}.ph .ic{width:42px;height:42px}.rc:hover .ph{transform:scale(1.05)}
.phw{overflow:hidden;height:190px}.rb{padding:1.1rem;display:flex;flex-direction:column;gap:.55rem;flex:1}.rt{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.rt h3{margin:0;font-size:1.25rem}
.rb p{margin:0;font-size:.95rem}.rf{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:.4rem}.pr{font-size:1.4rem;font-weight:800}
.sk{height:330px;background:linear-gradient(100deg,var(--soft) 30%,#fff 50%,var(--soft) 70%) 0 0/300% 100%;animation:sh 1.4s linear infinite}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:.15rem;transition:transform .35s var(--ease),box-shadow .35s,background .3s,color .3s}
.tile b{font-weight:800}.tile .sub{color:var(--muted);font-size:.88rem}
.ti{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center;margin-bottom:.7rem;transition:background .3s,color .3s,transform .35s var(--ease)}
.tile:hover{transform:translateY(-5px);box-shadow:0 22px 38px -26px rgba(99,53,65,.6)}.tile:hover .ti{background:var(--primary);color:var(--secondary);transform:rotate(-6deg)}
/* stepper */
.stp{display:flex;list-style:none;padding:0;margin:0 0 1.3rem;gap:.4rem}
.stp li{display:flex;align-items:center;gap:.4rem;flex:1;font-size:.85rem;font-weight:600;color:var(--muted)}.stp li:last-child{flex:none}
.stp li::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px;transition:background .5s}.stp li:last-child::after{display:none}
.stp b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:.8rem;flex:none;transition:all .4s var(--ease)}
.stp .now{color:var(--ink)}.stp .now b{background:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(99,53,65,.15)}.stp .done b{background:var(--rose);color:#fff}.stp .done::after{background:var(--rose)}
/* room code */
.key{background:var(--primary);color:#fff;text-align:center;padding:2rem 1rem;border-radius:24px}
.code{display:flex;justify-content:center;gap:.6rem;margin:.6rem 0}.code i{font-style:normal;font-weight:800;font-size:2.8rem;width:3.3rem;height:4.2rem;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.14);animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*90ms)}
/* motion */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--d,0)*90ms)}.reveal.in{opacity:1;transform:none}
#app.enter>*{animation:rise .6s var(--ease) both}#app.enter>:nth-child(2){animation-delay:.06s}#app.enter>:nth-child(3){animation-delay:.12s}#app.enter>:nth-child(n+4){animation-delay:.18s}
@keyframes up{to{transform:none}}@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes float{50%{transform:translateY(28px) scale(1.06)}}
@keyframes mq{to{transform:translateX(-50%)}}@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes sh{to{background-position:-300% 0}}
/* phone: bottom bar */
#tabbar{display:none}
@media(max-width:700px){nav{display:none}main{padding-bottom:6.5rem}
#tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(254,253,251,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
#tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.4rem;border-radius:12px;color:var(--muted);font:600 .72rem Manrope,sans-serif;cursor:pointer}#tabbar button.on{color:var(--primary);background:var(--soft)}
.stp span{display:none}.stp .now span{display:inline}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}.ln i{transform:none}}
</style>
</head>
<body>
<header id="hd"><div class="bar"><button class="brand" onclick="go('home')" aria-label="StayEasy home"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="M3 15h18"/><path d="M7 9V7h5v2"/></svg></span>StayEasy</button><nav id="nav"></nav></div></header>
<div id="wake" class="wake" hidden>Waking up the server. This can take up to a minute…</div>
<main id="app" class="wide"></main>
<nav id="tabbar" aria-label="Main"></nav>

<script>
/* ============ 1. SETTINGS ============ */
const API = 'https://hotel-booking-eagg.onrender.com';
/* Paystack links from Backend: POST /api/payment/initialize {bookingId} returns data.authorizationUrl;
   POST /api/payment/verify {reference}. Set TEST_MODE to true to practise without paying. */
const TEST_MODE = false;   // set true to practise without Paystack (nothing is charged)
/* ID upload from Backend: POST /api/bookings/:bookingId/id-verification (photo sent as a file upload).
   Backend has not said which field name they read the photo from. We send 'idDocument'.
   If Backend's reply says the file is missing, change 'field' to the name they use. */
const ID = { uploadPath: '/api/bookings/:bookingId/id-verification', field: 'idDocument' };
const PAYMENT = { initPath: '/api/payment/initialize', verifyPath: '/api/payment/verify' };   // received from Backend

/* ============ 2. APP MEMORY ============ */
const S = { token: null, user: null, view: 'home', mode: 'in', hotels: [], hotel: '', rooms: [], pick: '',
            from: '', to: '', guests: 1, pending: null, bookings: [], checkedIn: {}, requests: [], offers: [],
            error: '', ok: '', info: '', busy: false, next: '', idDone: {}, confirmed: null, loaded: false, hotelsError: '' };
/* The sign-in is kept for this browser tab only, so the guest is still signed in when Paystack sends them back. */
const store = {
  get() { try { return JSON.parse(sessionStorage.getItem('stayeasy') || 'null'); } catch { return null; } },
  set(v) { try { v ? sessionStorage.setItem('stayeasy', JSON.stringify(v)) : sessionStorage.removeItem('stayeasy'); } catch {} }
};

/* ============ 3. TALKING TO BACKEND (real) ============ */
async function call(path, { method = 'GET', body } = {}) {
  const wake = document.getElementById('wake');
  const timer = setTimeout(() => { wake.hidden = false; }, 4000);   // free servers can sleep
  try {
    const res = await fetch(API + path, {
      method,
      headers: { ...(body instanceof FormData ? {} : { 'Content-Type': 'application/json' }), ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
      body: body ? (body instanceof FormData ? body : JSON.stringify(body)) : undefined
    });
    let data = {}; try { data = await res.json(); } catch {}
    if (!res.ok || data.success === false) throw new Error(data.message || 'Something went wrong. Please try again.');
    return data;
  } catch (e) {
    if (e instanceof TypeError) throw new Error("Can't reach the server. Check your internet and try again.");
    throw e;
  } finally { clearTimeout(timer); wake.hidden = true; }
}
const pick = (d, k) => Array.isArray(d) ? d : (d[k] || d.data || []);
const api = {
  login: (email, password) => call('/api/auth/login', { method: 'POST', body: { email, password } }),
  register: b => call('/api/auth/register', { method: 'POST', body: b }),
  hotels: async () => pick(await call('/api/hotels'), 'hotels'),
  rooms: async id => pick(await call('/api/rooms/hotel/' + id), 'rooms'),
  myBookings: async () => pick(await call('/api/bookings/my-bookings'), 'bookings'),
  createBooking: async b => { const d = await call('/api/bookings', { method: 'POST', body: b }); return d.booking || d.data || d; } // proposed by Backend
};

/* ============ 4. STILL FAKE (Backend has not finished these) ============
   Replace each one when Backend sends the final link:
   check-in and ID upload, access code, service requests, offers. */
const wait = ms => new Promise(r => setTimeout(r, ms));
const fake = {
  async checkIn(file) { await wait(1200); if (!file) throw new Error('Add a photo of your ID first.'); },
  async accessCode() { await wait(300); return { code: '4821' }; },
  async addRequest(type, note) { await wait(400); return { id: Date.now(), type, note, status: 'Pending' }; },
  async offers() { await wait(100); return ['20% off a spa session this week', 'Free breakfast on your next stay', 'Late checkout on Sunday']; }
};

/* ============ 5. SMALL HELPERS ============ */
const naira = n => '₦' + Number(n || 0).toLocaleString('en-NG');
const day = x => x ? new Date(x).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const nights = () => Math.max(0, Math.round((new Date(S.to) - new Date(S.from)) / 864e5)) || 0;
const room = () => S.rooms.find(r => r._id === S.pick);
const estimate = () => nights() * (room()?.pricePerNight || 0);
const reqLabel = s => ({ Pending: 'Received', 'In Progress': 'In progress', Completed: 'Done', Cancelled: 'Cancelled' }[s] || s);
const roomOf = b => (b.room && typeof b.room === 'object') ? b.room : (S.rooms.find(r => r._id === b.room) || {});
const roomNo = b => roomOf(b).roomNumber || 'to be assigned';
const hotelName = b => b.hotel?.name || S.hotels.find(h => h._id === (b.hotel?._id || b.hotel))?.name || 'Hotel';
const testMode = () => TEST_MODE || !PAYMENT.initPath;
/* Only a Confirmed booking can check in. In test mode a Pending one is allowed so you can try the screens. */
const idOk = b => !!S.idDone[b._id] || b.idVerificationStatus === 'Verified';
const idChip = b => b.idVerificationStatus ? `<span class="chip">${({ Pending: 'ID pending', Verified: 'ID verified', NeedsReview: 'ID under review', Rejected: 'ID rejected' }[b.idVerificationStatus] || b.idVerificationStatus)}</span>` : '';
const eligible = b => b.bookingStatus === 'Confirmed' || (testMode() && b.bookingStatus === 'Pending');
const msg = () => (S.info ? `<div class="msg info">${S.info}</div>` : '') + (S.error ? `<div class="msg bad" role="alert">${S.error}</div>` : '') + (S.ok ? `<div class="msg ok">${S.ok}</div>` : '');
const authed = ['dashboard','bookings','checkin','key','requests','offers','rewards','idVerify','pay','paymentDone','confirmed'];
const go = v => {
  S.error = ''; S.ok = ''; S.info = ''; S.busy = false;
  if (authed.includes(v) && !S.token) { S.next = v; S.mode = 'in'; S.info = 'Sign in or create an account to continue.'; v = 'login'; }
  S.view = v; draw(); window.scrollTo(0, 0);
};
const backTo = (to, label) => `<button class="link back" onclick="go('${to}')">← ${label}</button>`;
const empty = (text, btn, to) => `<div class="card"><p>${text}</p><button class="go" onclick="go('${to}')">${btn}</button></div>`;

const P = { home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', bed: '<path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="M3 15h18"/><path d="M7 9V7h5v2"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>', key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>', gift: '<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 13h18"/><path d="M12 8c-1-4-5-4-5-1.5C7 8 12 8 12 8zm0 0c1-4 5-4 5-1.5C17 8 12 8 12 8z"/>',
  bell: '<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>' };
const I = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const STEPS = ['Room', 'Details', 'ID', 'Pay', 'Done'];
const stepOf = { rooms: 0, roomDetail: 0, bookingDetails: 1, idVerify: 2, pay: 3, paymentDone: 3, confirmed: 4 };
const stepper = n => `<ol class="stp" aria-label="Booking progress">${STEPS.map((t, i) => `<li class="${i < n ? 'done' : i === n ? 'now' : ''}"><b>${i < n ? '✓' : i + 1}</b><span>${t}</span></li>`).join('')}</ol>`;

/* ============ 6. SCREENS (follows the StayEasy sitemap and user flow in Figma) ============
   Book path:  Home > Rooms > Room details > Booking details > Sign in/up > ID verification > Payment > Booking confirmation
   Pre-arrival path:  Home > Sign in/up > Dashboard > Pre-arrival check-in > Digital room access > Recommendations > Loyalty */
const screens = {
  home: () => `<section class="hero"><span class="eyebrow">StayEasy · Digital guest experience</span>
    <h1 aria-label="Stay easy."><span class="ln"><i>Stay</i></span><span class="ln"><i>easy.</i></span></h1>
    <p>Book your room, check in before you arrive and open your door from your phone.</p>
    <div class="cta"><button class="btn" onclick="go('rooms')">Book now ${I('arrow')}</button><button class="btn ghost" onclick="go('dashboard')">Pre-arrival check-in</button></div>
    <span class="orb o1"></span><span class="orb o2"></span></section>
    <div class="marquee" aria-hidden="true"><div class="track">${[0, 1].map(() => ['Book', 'Check in', 'Unlock', 'Stay easy'].map(w => `<span>${w}</span>`).join('')).join('')}</div></div>
    <h2 class="reveal">Three steps. No queues.</h2>
    <div class="how">${[['01', 'Choose your room', 'Pick the dates and the room that suits you.'], ['02', 'Verify and pay', 'Confirm your ID and pay securely with Paystack.'], ['03', 'Check in and unlock', 'Check in online and get your room code.']]
      .map(([n, t, d], i) => `<div class="card reveal" style="--d:${i}"><div class="num">${n}</div><h3>${t}</h3><p class="muted" style="margin:0">${d}</p></div>`).join('')}</div>`,

  login: () => `<div class="card"><h2>${S.mode === 'up' ? 'Create your account' : 'Welcome back'}</h2>
    <p class="muted">${S.mode === 'up' ? 'Join to book, check in and earn rewards.' : 'Sign in to continue.'}</p>
    ${S.mode === 'up' ? `<label for="fn">First name</label><input id="fn" autocomplete="given-name">
    <label for="ln">Last name</label><input id="ln" autocomplete="family-name">
    <label for="ph">Phone</label><input id="ph" type="tel" autocomplete="tel">` : ''}
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="${S.mode === 'up' ? 'new-password' : 'current-password'}">
    ${msg()}<button class="go" onclick="doAuth()" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Please wait…' : S.mode === 'up' ? 'Create account' : 'Sign in'}</button>
    <p style="text-align:center">${S.mode === 'up' ? 'Have an account?' : 'New here?'}
      <button class="link" onclick="S.mode='${S.mode === 'up' ? 'in' : 'up'}';S.error='';draw()">${S.mode === 'up' ? 'Sign in' : 'Create an account'}</button></p></div>`,

  rooms: () => `<h2>Rooms</h2>${S.hotels.length > 1 ? `<label for="ht">Hotel</label><select id="ht" onchange="changeHotel(this.value)">${S.hotels.map(h => `<option value="${h._id}" ${h._id === S.hotel ? 'selected' : ''}>${h.name}</option>`).join('')}</select>` : ''}
    ${S.hotelsError ? `<div class="msg bad">${S.hotelsError}</div>` : !S.loaded ? '<div class="rgrid">' + '<div class="rc sk"></div>'.repeat(3) + '</div>' : ''}${msg()}
    <div class="rgrid">${S.rooms.filter(r => r.isAvailable !== false).map((r, i) => { const im = [].concat(r.images || [])[0]; return `<article class="rc reveal" style="--d:${i % 3}"><div class="phw"><div class="ph" ${im ? `style="background-image:url('${im}')"` : ''}>${im ? '' : I('bed')}</div></div>
      <div class="rb"><div class="rt"><h3>${r.roomType || 'Room'}</h3><span class="chip">Room ${r.roomNumber || ''}</span></div>
      <p class="muted">${r.description || 'A comfortable room for your stay.'}</p>
      <div class="rf"><div><span class="pr">${naira(r.pricePerNight)}</span><span class="muted"> / night</span><div class="muted sm">Up to ${r.capacity || 2} guests</div></div>
      <button class="btn sm" onclick="S.pick='${r._id}';go('roomDetail')">Details ${I('arrow')}</button></div></div></article>`; }).join('')}</div>
    ${S.loaded && !S.rooms.length && !S.hotelsError ? '<p class="muted">No rooms found for this hotel yet.</p>' : ''}`,

  roomDetail: () => { const r = room(); return !r ? empty('Choose a room first.', 'See rooms', 'rooms') :
    `${backTo('rooms', 'All rooms')}<h2>${r.roomType || 'Room'}</h2><div class="card"><p class="muted" style="margin-top:0">Room ${r.roomNumber || ''} · up to ${r.capacity || 2} guests</p>
    <p>${r.description || 'A comfortable room for your stay.'}</p>
    ${r.amenities?.length ? `<p><b>Includes:</b> ${[].concat(r.amenities).join(', ')}</p>` : ''}
    <p class="big" style="font-size:1.8rem;margin:.3rem 0">${naira(r.pricePerNight)} <span class="muted" style="font-size:1rem;font-weight:500">/ night</span></p>
    <button class="go" onclick="go('bookingDetails')">Select this room</button></div>`; },

  bookingDetails: () => { const r = room(); return !r ? empty('Choose a room first.', 'See rooms', 'rooms') :
    `${backTo('roomDetail', 'Room details')}<h2>Booking details</h2><div class="card"><p style="margin-top:0"><b>${r.roomType || 'Room'}</b> · Room ${r.roomNumber || ''}</p>
    <label for="from">Check-in date</label><input id="from" type="date" value="${S.from}" onchange="S.from=this.value;draw()">
    <label for="to">Check-out date</label><input id="to" type="date" value="${S.to}" onchange="S.to=this.value;draw()">
    <label for="gs">Guests</label><input id="gs" type="number" min="1" max="${r.capacity || 10}" value="${S.guests}" onchange="S.guests=+this.value||1">
    <p><b>${nights()} night(s)</b> · Estimated total <b>${naira(estimate())}</b></p>
    <p class="muted" style="margin:0">The hotel confirms the final amount at the next step.</p>${msg()}
    <button class="go" onclick="toVerify()" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Reserving…' : S.token ? 'Continue' : 'Continue (sign in required)'}</button></div>`; },

  idVerify: () => !S.pending ? empty('Choose a room first.', 'See rooms', 'rooms') : `<h2>Verify your identity</h2><div class="card">
    <p style="margin-top:0">Add a photo of your passport, driver's licence or national ID. We use it to confirm it's you.</p>
    ${idChip(S.pending)}
    ${ID.uploadPath ? '' : '<div class="msg info">ID verification is not connected to Backend yet. Payment stays blocked until it is.</div>'}
    <label for="idf">ID photo</label><input id="idf" type="file" accept="image/*">${msg()}
    <button class="go" onclick="doIdVerify()" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Checking your ID…' : 'Verify my ID'}</button></div>`,

  pay: () => !S.pending ? empty('Choose a room first.', 'See rooms', 'rooms') : `<h2>Payment</h2><div class="card">
    <p style="margin-top:0">${hotelName(S.pending)}${roomOf(S.pending).roomType ? ' · ' + roomOf(S.pending).roomType : ''}</p>
    <p class="big">${naira(S.pending.totalAmount ?? estimate())}</p>
    ${S.pending.expiresAt ? `<p class="muted">Complete payment before ${new Date(S.pending.expiresAt).toLocaleString('en-NG')}.</p>` : ''}
    ${testMode() ? `<div class="msg info">Test mode: the real Paystack payment is not connected yet, so nothing is charged.</div>
      <label><input type="checkbox" id="fail"> Test a failed payment</label>` : '<p class="muted">You will be taken to Paystack to pay securely.</p>'}
    ${msg()}${/identity|ID verification/i.test(S.error) ? '<button class="go alt" onclick="go(\'idVerify\')">Go to ID verification</button>' : ''}<button class="go" onclick="doPay()" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Processing…' : S.error ? 'Try payment again' : 'Pay now'}</button></div>`,

  paymentDone: () => `<h2>Payment</h2><div class="card">${S.busy ? '<p style="margin:0">Confirming your payment…</p>' : msg() + `<button class="go" onclick="go('bookings')">See my bookings</button>`}</div>`,

  confirmed: () => { const b = S.confirmed; return !b ? empty('No booking to show yet.', 'My bookings', 'bookings') :
    `<h2>Booking confirmed</h2><div class="card"><div class="msg ok" style="margin-top:0">${S.ok || 'Your booking is confirmed.'}</div>
    <p><b>${hotelName(b)}</b><br>${roomOf(b).roomType || 'Room'} · ${day(b.checkInDate)} to ${day(b.checkOutDate)}<br>Total ${naira(b.totalAmount)}</p>
    <p class="muted" style="margin:0">Next: check in online before you arrive and get your room code.</p>
    <button class="go" onclick="go('checkin')">Pre-arrival check-in</button><button class="go alt" onclick="go('dashboard')">Go to dashboard</button></div>`; },

  dashboard: () => `<h2>Hello${S.user?.firstName ? ', ' + S.user.firstName : ''}</h2><p class="muted" style="margin:0 0 1rem">What would you like to do?</p>${msg()}
    <div class="tiles">${[['bookings', 'cal', 'My bookings', S.bookings.length + ' booking(s)'], ['checkin', 'shield', 'Pre-arrival check-in', 'Before you arrive'], ['key', 'key', 'Digital room access', 'Your room code'],
      ['offers', 'gift', 'Recommendations', 'Picked for you'], ['rewards', 'star', 'Loyalty', (S.user?.loyaltyPoints || 0).toLocaleString() + ' points'], ['requests', 'bell', 'Service requests', 'Housekeeping and more']]
      .map(([v, ic, t, sub], i) => `<button class="tile reveal" style="--d:${i}" onclick="go('${v}')"><span class="ti">${I(ic)}</span><b>${t}</b><span class="sub">${sub}</span></button>`).join('')}</div>
    <button class="go" onclick="go('rooms')">Book another stay</button>`,

  bookings: () => `${backTo('dashboard', 'Dashboard')}<h2>My bookings</h2>${msg()}${S.bookings.length ? S.bookings.map(b => `<div class="card">
    <b>${hotelName(b)}</b> <span class="chip">${b.bookingStatus}</span> ${idChip(b)}
    <p class="muted" style="margin:.3rem 0 0">${roomOf(b).roomType || 'Room'} · ${day(b.checkInDate)} to ${day(b.checkOutDate)} · ${naira(b.totalAmount)}</p></div>`).join('')
    : empty('You have no bookings yet.', 'Book a room', 'rooms')}`,

  checkin: () => {
    const el = S.bookings.filter(eligible), todo = el.find(b => !S.checkedIn[b._id]);
    if (!el.length) return backTo('dashboard', 'Dashboard') + empty('You have no confirmed booking yet. Book and pay to check in online.', 'Book a room', 'rooms');
    if (!todo) return `${backTo('dashboard', 'Dashboard')}<h2>Check-in confirmed</h2><div class="card"><div class="msg ok" style="margin:0">You are checked in. Room ${roomNo(el[0])}.</div>
      <button class="go" onclick="go('key')">Get my room code</button></div>`;
    return `${backTo('dashboard', 'Dashboard')}<h2>Pre-arrival check-in</h2><div class="card"><p style="margin-top:0">${hotelName(todo)}, arriving ${day(todo.checkInDate)}.</p>
      <label for="arr">Expected arrival time</label><select id="arr"><option>Before 12:00</option><option>12:00 to 15:00</option><option>15:00 to 18:00</option><option>After 18:00</option></select>
      ${idOk(todo) ? '<p class="msg ok">Your ID is already verified.</p>' : `<label for="idf">ID photo</label><input id="idf" type="file" accept="image/*">`}${msg()}
      <button class="go" onclick="doCheckIn('${todo._id}')" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Checking in…' : 'Check in'}</button></div>`;
  },

  key: () => {
    const b = S.bookings.find(x => S.checkedIn[x._id]);
    if (!b) return backTo('dashboard', 'Dashboard') + empty('Check in first. Your room code appears here afterwards.', 'Go to check-in', 'checkin');
    return `${backTo('dashboard', 'Dashboard')}<h2>Digital room access</h2><div class="card key"><p style="margin:0">Room ${roomNo(b)}</p>
      <p class="code" aria-label="Room code ${S.checkedIn[b._id].code}">${[...String(S.checkedIn[b._id].code)].map((d, i) => `<i style="--i:${i}">${d}</i>`).join('')}</p>
      <p style="margin:0">Enter this code on the door keypad.<br>Works ${day(b.checkInDate)} to ${day(b.checkOutDate)}. Do not share it.</p></div>
      <button class="go" onclick="go('offers')">See recommendations</button>`;
  },

  offers: () => `${backTo('dashboard', 'Dashboard')}<h2>Recommendations</h2>${S.offers.map(o => `<div class="card">${o}</div>`).join('')}
    <button class="go" onclick="go('rewards')">See my loyalty rewards</button>`,

  rewards: () => `${backTo('dashboard', 'Dashboard')}<h2>Loyalty</h2><div class="card"><p class="muted" style="margin:0">${S.user?.loyaltyTier || 'Standard'} member</p>
    <p class="big" style="margin:0">${(S.user?.loyaltyPoints || 0).toLocaleString()} points</p>
    <p class="muted" style="margin:.4rem 0 0">Earn 1 point for every ₦1,000 you spend. Tiers: Standard, Silver, Gold, Platinum.</p></div>`,

  requests: () => `${backTo('dashboard', 'Dashboard')}<h2>Service requests</h2><div class="card"><label for="ty">What do you need?</label>
    <select id="ty"><option>Housekeeping</option><option>Room service</option><option>Maintenance</option><option>Other</option></select>
    <label for="nt">Details</label><textarea id="nt" rows="3" placeholder="e.g. Two extra towels, please"></textarea>${msg()}
    <button class="go" onclick="doRequest()">Send request</button></div>
    ${S.requests.length ? S.requests.map(r => `<div class="card"><b>${r.type}</b> <span class="chip">${reqLabel(r.status)}</span><p class="muted" style="margin:.3rem 0 0">${r.note || 'No details added'}</p></div>`).join('')
      : '<p class="muted">No requests yet. Send one above and track it here.</p>'}`
};

/* ============ 7. ACTIONS ============
   Always read what the guest typed BEFORE calling run(), because run() redraws the screen. */
async function run(fn) {
  S.busy = true; S.error = ''; draw();
  try { await fn(); } catch (e) { S.error = e.message; }
  S.busy = false; draw();
}
async function loadHotels() {
  S.hotels = await api.hotels();
  if (S.hotels[0] && !S.hotel) S.hotel = S.hotels[0]._id;
  if (S.hotel) { S.rooms = await api.rooms(S.hotel); S.pick = S.pick || S.rooms[0]?._id; }
  S.loaded = true; S.hotelsError = '';
}
function doAuth() {
  const v = id => (document.getElementById(id)?.value || '').trim();
  const up = S.mode === 'up';
  const f = { firstName: v('fn'), lastName: v('ln'), phone: v('ph'), email: v('em'), password: document.getElementById('pw').value };
  run(async () => {
    if (!f.email || !f.password) throw new Error('Enter your email and password.');
    let d;
    if (up) {
      if (!f.firstName || !f.lastName) throw new Error('Enter your first and last name.');
      d = await api.register(f);
      if (!d.token) d = await api.login(f.email, f.password);
    } else d = await api.login(f.email, f.password);
    S.token = d.token; S.user = d.guest || d.user || {};
    store.set({ token: S.token, user: S.user });
    await afterSignIn();
  });
}
async function afterSignIn() {
  S.bookings = await api.myBookings().catch(() => []);
  S.offers = await fake.offers();
  S.info = ''; const n = S.next; S.next = '';
  if (n === 'paymentDone') { S.view = 'dashboard'; setTimeout(verifyReturn, 0); } else S.view = n || 'dashboard';
}
function signOut() { store.set(null); Object.assign(S, { token: null, user: null, bookings: [], pending: null, checkedIn: {}, idDone: {}, view: 'home' }); draw(); }
const changeHotel = id => run(async () => { S.hotel = id; S.rooms = await api.rooms(id); S.pick = S.rooms[0]?._id; });
function toVerify() {
  if (nights() < 1) { S.error = 'Check-out must be after check-in.'; return draw(); }
  if (!S.token) { S.next = 'bookingDetails'; S.mode = 'up'; S.error = ''; S.info = 'Create an account or sign in to continue your booking.'; S.view = 'login'; return draw(); }
  run(async () => {
    S.pending = await api.createBooking({ hotel: S.hotel, room: S.pick, checkInDate: S.from, checkOutDate: S.to, numberOfGuests: S.guests });
    S.view = 'idVerify';
  });
}
/* ID check is a fake for now. In the Figma flow it happens before payment; Backend planned it at check-in. */
function doIdVerify() {
  const file = document.getElementById('idf')?.files[0];
  run(async () => {
    if (!file) throw new Error("We couldn't read your ID. Add a clear photo and try again.");
    if (!ID.uploadPath) throw new Error('ID verification is not connected to Backend yet, so payment is blocked. Ask Backend for the ID upload link.');
    const id = S.pending._id, fd = new FormData(); fd.append(ID.field, file);
    const d = await call(ID.uploadPath.replace(':bookingId', encodeURIComponent(id)), { method: 'POST', body: fd });
    const fromReply = [d.booking, d.data].find(x => x && typeof x === 'object' && x.idVerificationStatus);
    S.bookings = await api.myBookings().catch(() => S.bookings);
    S.pending = { ...S.pending, ...(fromReply || {}), ...(S.bookings.find(x => x._id === id) || {}) };
    const st = S.pending.idVerificationStatus;
    if (st === 'Rejected') throw new Error('Your ID was rejected. Please upload a clearer photo.');
    if (st === 'Pending' || st === 'NeedsReview') { S.ok = 'ID received. We are checking it. You can pay once it is verified.'; return; }
    S.idDone[S.pending._id] = true; S.view = 'pay';
  });
}
/* Payment start (below) */
async function startPayment(fail) {
  if (testMode()) { await wait(900); if (fail) throw new Error("Payment didn't go through. You were not charged. Try again or use another card."); return 'test'; }
  const d = await call(PAYMENT.initPath, { method: 'POST', body: { bookingId: S.pending._id } });
  const url = d.data?.authorizationUrl;
  if (!url) throw new Error('Could not start the payment. Please try again.');
  location.href = url;   // guest pays on Paystack, then returns to /payment-complete
}
function doPay() {
  const fail = !!document.getElementById('fail')?.checked;
  run(async () => {
    if (await startPayment(fail) === 'test') {
      S.bookings = await api.myBookings().catch(() => S.bookings);
      S.confirmed = S.bookings.find(b => b._id === S.pending._id) || S.pending;
      S.ok = 'Test mode: payment was simulated. On the server the booking stays Pending until real payment is connected.';
      S.view = 'confirmed';
    }
  });
}
/* Guest comes back from Paystack to /payment/callback?reference=... (or /payment-complete) We never mark anything as paid ourselves. */
function verifyReturn() {
  const p = new URLSearchParams(location.search), ref = p.get('reference') || p.get('trxref');
  S.view = 'paymentDone';
  run(async () => {
    if (!PAYMENT.verifyPath) throw new Error('Payment confirmation is not connected yet. Your booking stays Pending until Backend confirms it.');
    if (!ref) throw new Error('We could not find your payment reference.');
    await call(PAYMENT.verifyPath, { method: 'POST', body: { reference: ref } });
    S.bookings = await api.myBookings();
    S.confirmed = S.bookings.find(b => b.bookingStatus === 'Confirmed') || S.bookings[0];
    S.ok = 'Payment confirmed. Your booking is confirmed.'; S.view = 'confirmed';
  });
}
function doCheckIn(id) {
  const file = document.getElementById('idf')?.files[0], needId = !S.idDone[id];
  run(async () => {
    if (needId && !file) throw new Error('Add a photo of your ID first.');
    await fake.checkIn(needId ? file : true);
    S.idDone[id] = true; S.checkedIn[id] = await fake.accessCode();
  });
}
async function doRequest() {
  const type = document.getElementById('ty').value, note = document.getElementById('nt').value;
  const r = await fake.addRequest(type, note);
  S.requests.unshift(r); S.ok = 'Request sent.'; draw();
  setTimeout(() => { r.status = 'In Progress'; if (S.view === 'requests') draw(); }, 5000);
}

/* ============ 8. DRAWING AND START ============ */
const groups = { home: ['home'], rooms: ['rooms', 'roomDetail', 'bookingDetails', 'idVerify', 'pay', 'paymentDone', 'confirmed'],
                 dashboard: ['dashboard', 'bookings', 'checkin', 'key', 'requests', 'offers', 'rewards'] };
let lastView = '';
function draw() {
  const on = k => groups[k].includes(S.view) ? 'on' : '';
  const out = S.token ? `<button onclick="signOut()">Sign out</button>` : `<button class="${S.view === 'login' ? 'on' : ''}" onclick="S.mode='in';go('login')">Sign in</button>`;
  document.getElementById('nav').innerHTML = `<button class="${on('home')}" onclick="go('home')">Home</button><button class="${on('rooms')}" onclick="go('rooms')">Rooms</button><button class="${on('dashboard')}" onclick="go('dashboard')">Dashboard</button>` + out;
  const tb = (cls, ic, t, fn) => `<button class="${cls}" onclick="${fn}">${I(ic)}<span>${t}</span></button>`;
  document.getElementById('tabbar').innerHTML = tb(on('home'), 'home', 'Home', "go('home')") + tb(on('rooms'), 'bed', 'Rooms', "go('rooms')") + tb(on('dashboard'), 'grid', 'Dashboard', "go('dashboard')")
    + (S.token ? tb('', 'user', 'Sign out', 'signOut()') : tb(S.view === 'login' ? 'on' : '', 'user', 'Sign in', "S.mode='in';go('login')"));
  const app = document.getElementById('app'), n = stepOf[S.view];
  app.className = (['home', 'rooms'].includes(S.view) ? 'wide' : 'narrow') + (S.view !== lastView ? ' enter' : ''); lastView = S.view;
  app.innerHTML = (n !== undefined ? stepper(n) : '') + screens[S.view]();
  const io = window.__io || (window.__io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); window.__io.unobserve(e.target); } }), { threshold: 0.12 }));
  app.querySelectorAll('.reveal').forEach(el => io.observe(el));
}
window.addEventListener('scroll', () => document.getElementById('hd').classList.toggle('scrolled', scrollY > 8), { passive: true });
(async function start() {
  const saved = store.get();
  const p = new URLSearchParams(location.search);
  const back = /payment-complete|payment\/callback/.test(location.pathname + location.hash) || p.has('reference') || p.has('trxref');
  const d = x => new Date(Date.now() + x * 864e5).toISOString().slice(0, 10);
  S.from = d(7); S.to = d(9);
  if (saved?.token) {
    S.token = saved.token; S.user = saved.user;
    try { S.bookings = await api.myBookings(); S.offers = await fake.offers(); } catch { signOut(); }
  } else if (back) { S.next = 'paymentDone'; S.mode = 'in'; S.info = 'Sign in to see your payment result.'; S.view = 'login'; }
  if (S.token && back) verifyReturn(); else draw();
  loadHotels().then(draw).catch(e => { S.hotelsError = e.message; S.loaded = true; draw(); });
})();
</script>
